name: Validate CampusMaaS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Playwright for UI smoke test
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/campusmaas-dev.log 2>&1 &
          echo $! > /tmp/campusmaas-dev.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campusmaas-dev.log
          exit 1

      - name: UI smoke test
        run: node scripts/ui-smoke-test.mjs

      - name: Dev server log on failure
        if: failure()
        run: cat /tmp/campusmaas-dev.log
